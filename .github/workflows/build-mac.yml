name: Build Mac App
on: workflow_dispatch
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pygame pyinstaller
      - run: pyinstaller --onefile --windowed Pong.py
      - uses: actions/upload-artifact@v4
        with:
          name: pong-mac
          path: dist/Pong